# Local dev orchestration. Mirrors the Zeabur topology:
#   - 1 Postgres
#   - 3 service containers (harness, api, sandbox, investigation)
#   - 1 web (Next.js) — usually run on host with `pnpm dev` for HMR
#
# Each service reads from the root .env file.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel
      POSTGRES_DB: sentinel
    ports:
      - "5432:5432"
    volumes:
      - sentinel_pg:/var/lib/postgresql/data
      - ./db/migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
      - ./db/seeds/001_seed_incidents.sql:/docker-entrypoint-initdb.d/101_seed_incidents.sql:ro
      - ./db/seeds/002_seed_harness_status.sql:/docker-entrypoint-initdb.d/102_seed_harness_status.sql:ro

  control-plane:
    # AgentField FOSS control plane — registry, observability dashboard,
    # cross-agent routing, VC audit. Agents auto-register on startup.
    image: agentfield/control-plane:latest
    restart: unless-stopped
    ports:
      - "8080:8080"

  harness:
    build: ./apps/harness
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://sentinel:sentinel@db:5432/sentinel
      AGENTFIELD_SERVER: http://control-plane:8080
      AGENT_CALLBACK_URL: http://harness:8003
    depends_on:
      - db
      - control-plane
    ports:
      - "8003:8003"

  api:
    build: ./apps/api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://sentinel:sentinel@db:5432/sentinel
    depends_on:
      - db
    ports:
      - "8000:8000"

  sandbox:
    build: ./apps/sandbox
    restart: unless-stopped
    env_file: .env
    # Sandbox container is intentionally minimal:
    # - no persistent volume
    # - no DB mount
    # - egress-only network
    ports:
      - "8001:8001"

  investigation:
    build: ./apps/investigation
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://sentinel:sentinel@db:5432/sentinel
      AGENTFIELD_SERVER: http://control-plane:8080
      AGENT_CALLBACK_URL: http://investigation:8002
      SANDBOX_URL: http://sandbox:8001
    depends_on:
      - db
      - control-plane
      - sandbox
    ports:
      - "8002:8002"

volumes:
  sentinel_pg:
